name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check formatting, API and all targets
        run: |
          moon version --all
          moon fmt --check
          for target in js wasm wasm-gc native; do
            moon check --target "$target" --deny-warn
            moon build --target "$target" --deny-warn
            moon test --target "$target" --deny-warn
          done
          moon info --target js
          git diff --exit-code -- '*.mbti'
          moon package
          moon run examples/sites --target js
          moon run examples/sites --target native
          node tools/check_cli.mjs
          node tools/check_input.mjs
          python3 tools/check_consumer.py
      - name: Independent Valgrind reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
          valgrind --version
          sha256sum -c fixtures/SHA256SUMS
          python3 tools/check_fixture.py
          node tools/check_reference.mjs
      - name: Retain verified source package
        uses: actions/upload-artifact@v4
        with:
          name: mooncallgrind-source-${{ github.sha }}
          path: _build/publish/Rindoncreate-mooncallgrind-0.1.0.zip
          if-no-files-found: error
      - name: Format failed sources for diagnostics only
        if: failure()
        run: |
          moon fmt
          moon check --target js --deny-warn
      - name: Export public source for inspection
        if: always()
        run: python3 tools/export_ci.py
